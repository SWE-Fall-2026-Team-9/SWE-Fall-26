<!DOCTYPE html>
<html>

<head>
  <title>Play Action</title>
  <style>
    #game-audio {
      display: none;
    }

    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* The big yellow box around everything */
    .frame {
      position: relative;
      max-width: 900px;
      margin: 20px auto;
      border: 4px solid #e8e27a;
      border-radius: 16px;
      padding: 10px 20px 0 20px;
    }

    .label {
      position: absolute;
      top: -18px;
      right: 30px;
      background-color: black;
      padding: 0 6px;
      color: #3fd8ff;
      font-size: 26px;
      font-weight: bold;
      font-style: italic;
    }

    .teams {
      display: flex;
      gap: 40px;
      min-height: 220px;
    }

    .team {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    .team h2 {
      text-align: center;
      font-size: 30px;
      margin: 10px 0;
    }

    .players {
      flex-grow: 1;
    }

    .player {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      margin: 4px 0;
    }

    .total {
      text-align: right;
      font-size: 22px;
      margin: 10px 0;
    }

    .red {
      color: #ff8a80;
    }

    .green {
      color: #69f0ae;
    }

    .action {
      position: relative;
      border: 4px solid #e8e27a;
      border-radius: 10px;
      margin-top: 20px;
    }

    #events {
      background-color: #2b3a9e;
      height: 280px;
      overflow-y: auto;
      border-radius: 6px 6px 0 0;
      padding: 24px 12px 12px 12px;
      font-size: 22px;
      font-weight: bold;
      font-style: italic;
    }

    .timer {
      text-align: right;
      font-size: 26px;
      font-weight: bold;
      padding: 8px 16px;
      border-top: 4px solid #e8e27a;
    }

    .player-name-container {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .hidden {
      visibility: hidden;
    }

    .event {
      margin: 2px 0;
      padding: 2px 4px;
    }

    .event-base {
      color: #e8e27a;
    }
    #back-button {
      display: none;
      margin: 20px auto 0 auto;
      padding: 12px 28px;
      font-size: 22px;
      font-weight: bold;
      color: black;
      background-color: #e8e27a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #back-button:hover {
      background-color: #fff59d;
    }

  </style>

  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
</head>

<body>

  <div class="frame">
    <div class="label">Current Scores</div>

    <div class="teams">
      <div class="team">
        <h2>RED TEAM</h2>
        <div class="players" id="red-players"></div>
        <div class="total red" id="red-total">Total: 0</div>
      </div>

      <div class="team">
        <h2>GREEN TEAM</h2>
        <div class="players" id="green-players"></div>
        <div class="total green" id="green-total">Total: 0</div>
      </div>
    </div>

    <div class="action">
      <div class="label">Current Game Action</div>
      <div id="events"></div>
      <div class="timer">Time Remaining: <span id="time">--:--</span></div>
    </div>
    <button id="back-button" type="button">Return to Player Entry</button>
    <br>
  </div>

  <audio id="game-audio" preload="auto"></audio>

  <script>
    let playersInterval = null;
    let timerInterval = null;

    const socket = io();
    const formatter = new Intl.NumberFormat('en-US', {
      minimumIntegerDigits: 2
    })

    const gameAudio = document.getElementById("game-audio");
    const trackPlayback = sessionStorage.getItem("photonGameTrack");
    if (trackPlayback) {
      sessionStorage.removeItem("photonGameTrack");
      try {
        const playback = JSON.parse(trackPlayback);
        const validTrack = /^\/static\/photon_tracks\/Track0[1-8]\.mp3$/.test(playback.track);
        const elapsedSeconds = (Date.now() - playback.startedAt) / 1000;
        if (validTrack && Number.isFinite(elapsedSeconds) && elapsedSeconds >= 0) {
          gameAudio.src = playback.track;
          gameAudio.addEventListener("loadedmetadata", function () {
            if (elapsedSeconds < gameAudio.duration) {
              gameAudio.currentTime = elapsedSeconds;
              gameAudio.play().catch(error => {
                console.error("Unable to continue the game track:", error);
              });
            }
          }, { once: true });
        }
      } catch (error) {
        console.error("Unable to restore the game track:", error);
      }
    }

    socket.on('game-event', event => {
      if (!event || !event.message) {
        return;
      }

      const eventBox = document.createElement("div");
      eventBox.className = "event" + (event.type === "base-hit" ? " event-base" : "");
      const timestamp = event.timestamp;
      eventBox.textContent = `[${formatter.format(timestamp[0])}:${formatter.format(timestamp[1])}] ` + event.message;

      const events = document.getElementById("events");
      // Newest events go at the top; older events move down the feed.
      events.insertBefore(eventBox, events.firstChild);
      events.scrollTop = 0;
    });

    // Make one row for a player: codename on the left, score on the right
    function makePlayerRow(player) {
      const row = document.createElement("div");
      row.className = "player " + player.team;

      const playerNameContainer = document.createElement("div");
      playerNameContainer.className = "player-name-container";

      const baseIcon = document.createElement("img");
      baseIcon.src = "{{ url_for('static', filename='baseicon.jpg') }}";
      baseIcon.classList.add("hidden");
      playerNameContainer.appendChild(baseIcon);

      if (player.hasHitBase) {
        baseIcon.classList.remove("hidden");
      }

      const name = document.createElement("span");
      name.textContent = player.codename;
      playerNameContainer.appendChild(name);

      const score = document.createElement("span");
      score.textContent = player.score;

      row.appendChild(playerNameContainer);
      row.appendChild(score);
      return row;
    }

    async function showPlayers() {
      const response = await fetch("/api/game/players");
      const result = await response.json();

      if (!result.success) {
        return;
      }

      const players = result.data;
      players.sort(function (a, b) {
        return b.score - a.score;
      });

      const redList = document.getElementById("red-players");
      const greenList = document.getElementById("green-players");
      redList.innerHTML = "";
      greenList.innerHTML = "";

      let redTotal = 0;
      let greenTotal = 0;

      for (const player of players) {
        if (player.team === "red") {
          redList.appendChild(makePlayerRow(player));
          redTotal = redTotal + player.score;
        } else {
          greenList.appendChild(makePlayerRow(player));
          greenTotal = greenTotal + player.score;
        }
      }

      document.getElementById("red-total").textContent = "Total: " + redTotal;
      document.getElementById("green-total").textContent = "Total: " + greenTotal;
    }

    showPlayers();
    playersInterval = setInterval(showPlayers, 1000);
    
    const secondsAtLoad = Number("{{ seconds_left | default(360) }}");
    const endTime = Date.now() + secondsAtLoad * 1000;
    let gameEnded = false;

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes + ":" + String(seconds).padStart(2, "0");
    }

    async function endGame() {
      if (gameEnded) {
        return;
      }
      gameEnded = true;
      clearInterval(timerInterval);
      document.getElementById("time").textContent = "0:00";

      try {
        const response = await fetch("/api/game/end", { method: "POST" });
        const result = await response.json();
        if (!result.success) {
          console.error("Could not end game:", result.error);
        }
      } catch (error) {
        console.error("Could not end game:", error);
      }

      // One last refresh so the final scores are shown, then stop polling
      await showPlayers();
      clearInterval(playersInterval);

      const done = document.createElement("div");
      done.className = "event event-base";
      done.textContent = "GAME OVER";
      const events = document.getElementById("events");
      events.insertBefore(done, events.firstChild);
      events.scrollTop = 0;
      document.getElementById("back-button").style.display = "block";
    }

    document.getElementById("back-button").addEventListener("click", function () {
      window.location.href = "/";
    });


    function updateTimer() {
      // Work from the real clock, so the timer doesn't drift
      const secondsLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      document.getElementById("time").textContent = formatTime(secondsLeft);
      if (secondsLeft <= 0) {
        endGame();
      }
    }

    timerInterval = setInterval(updateTimer, 250);
    updateTimer();

  </script>
</body>

</html>
